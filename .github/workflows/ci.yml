name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: pip check
        run: python -m pip check

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eci_test
          POSTGRES_PASSWORD: eci_test
          POSTGRES_DB: eci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eci_test -d eci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://eci_test:eci_test@localhost:5432/eci_test
      ECI_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://eci_test:eci_test@localhost:5432/eci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: pip check
        run: python -m pip check

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Verify Alembic current revision is head
        run: python tests/postgres/alembic_checks.py assert-head

      - name: Alembic downgrade base
        run: alembic downgrade base

      - name: Confirm application schema is absent
        run: python tests/postgres/alembic_checks.py assert-empty

      - name: Alembic upgrade head again
        run: alembic upgrade head

      - name: PostgreSQL integration tests
        run: python -m pytest tests/postgres -q

  frontend:
    name: Frontend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Production build
        run: npm run build
